<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StructAI</title>

    <!-- GitHub Pages base path -->
    <base href="/StructAI-App/" />
	<link rel="manifest" href="manifest.webmanifest" />

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="css/MainLayout.css" rel="stylesheet" />
    <link href="css/NavMenu.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="/StructAI-App/" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="js/storage.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/structAI.js"></script>    

    <!-- GitHub Pages PWA service worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/StructAI-App/service-worker.js', {
                scope: '/StructAI-App/'
            });
        }
    </script>
</body>

</html>
